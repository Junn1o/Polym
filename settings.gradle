pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'KikuGie Releases'
			url = 'https://maven.kikugie.dev/releases'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	id 'dev.kikugie.stonecutter' version '0.9.8'
}

stonecutter {
	create(rootProject) {
		versions '1.21.4', '1.21.5', '1.21.6', '1.21.8', '1.21.11'
		vcsVersion = '1.21.11'
	}
}

rootProject.name = 'polymcoin'
