plugins {
	id 'net.fabricmc.fabric-loom-remap'
	id 'maven-publish'
}

version = "${project.mod_version}+${stonecutter.current.version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"polymcoin" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runConfigs.all {
		// share one run folder between all versions
		runDir = '../../run'
	}
}

dependencies {
	// per-version values come from versions/<mc>/gradle.properties
	minecraft "com.mojang:minecraft:${stonecutter.current.version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	def props = [
		version  : project.version,
		minecraft: project.mc_compat,
		loader   : project.loader_version
	]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from(rootProject.file("LICENSE")) {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

// copies every version's jar into build/libs/<mod_version>/ at the root
tasks.register('buildAndCollect', Copy) {
	group = 'build'
	from remapJar.archiveFile
	into rootProject.layout.buildDirectory.dir("libs/${project.mod_version}")
	dependsOn 'build'
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}

// gametests live in src/gametest and are not packed into the release jar
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "polymcoin-test"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}
